[package]
name = "cach"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-utils = "0.8.20"
hashbrown = "0.15"
parking_lot = "0.12.3"
scc = "2.2.1"
smallvec = { version = "1.13.2", features = ["union", "const_generics"] }
rand = { version = "0.9", features = ["small_rng", "std_rng"], optional = true }
stable_deref_trait = "1.2.0"
trait-variant = "0.1.2"
futures = "0.3.31"
slab = "0.4.9"
arc-swap = "1.7.1"
ref-cast = "1.0.24"
erasable = "1.3.0"
equivalent = "1.0.2"

[features]
default = ["rand"]
